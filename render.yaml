services:
  - type: web
    name: campusfind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: CampusFind
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: campusfind-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: campusfind-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: campusfind-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: campusfind-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: campusfind-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: campusfind-db
    databaseName: campusfind
    user: campusfind_user
    plan: free
    region: oregon
