services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_NAME: "CampusFind"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      # Optional: paste the key from backend/.env to keep sessions across rebuilds.
      # APP_KEY: base64:your-key-here
      FRONTEND_URL: http://localhost:8080
